[project]
name = "strata-booking"
version = "0.1.0"
description = "strata.booking — Savanna coaching appointment booking service."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "strata-core",  # canonical models + migration history (local path dep)
    "strata-identity",  # the shared verification seam (local path dep)
    "PyJWT>=2.9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",  # random suite order every run: order-coupling fails loudly
    "httpx>=0.27",
    "schemathesis>=4.0",
    "testcontainers>=4.0",
    "invoke>=2.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_booking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (spins a real Jaeger); deselect with -m 'not integration'",
    "contract: Schemathesis contract/fuzz suite over the OpenAPI schema",
]

[tool.coverage.run]
source = ["strata_booking"]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
# strata-core/strata-identity are installed editable (PEP 660 import hooks mypy
# can't follow); resolve them from source instead.
mypy_path = "../strata.identity:../strata.core"
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
