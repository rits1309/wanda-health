[project]
name = "strata-engine-auth"
version = "0.1.0"
description = "Strata.Engine.Auth — Savanna's authentication service over the single platform Cognito user pool."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.0",      # EmailStr fields in the API contract
    "boto3>=1.35",               # Cognito IdP calls (runtime UNSIGNED + credentialed admin)
    "httpx>=0.27",  # the legacy credentials-check call (migration login)
    "pyjwt[crypto]>=2.8",        # RS256 access-token verification against the pool JWKS
    # The shared identity domain — local path dependency within this repo:
    # installed editable in dev (pip install -e ../strata.identity); container builds
    # COPY it in from the repo-root build context.
    "strata-identity",
    "strata-core",  # canonical models + migration history (local path dep)
    "sqlalchemy[asyncio]>=2.0",  # session over the shared database (identity schema)
    "asyncpg>=0.30",
    # Observability: identical stack to the sibling services.
    "structlog>=24.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
# Everything needed to test, lint, type-check, and security-scan the project.
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",  # random suite order every run: order-coupling fails loudly
    "httpx>=0.27",            # Starlette TestClient
    "anyio>=4.4",
    "schemathesis>=4.0",      # OpenAPI schema-driven contract/fuzz testing
    "testcontainers[postgres]>=4.0",  # ephemeral Postgres for the profile/DB tests
    "invoke>=2.0",            # task runner (tasks.py)
    "botocore[crt]>=1.35",    # the `aws login` credential provider (seed script)
    "ruff>=0.7",              # lint + format
    "mypy>=1.11",             # static type checking
    "bandit>=1.7",            # SAST security linter
    "pip-audit>=2.7",         # dependency CVE scanner
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_engine_auth*"]

# ---------------------------------------------------------------------------
# Tool config — kept here so pyproject.toml is the single source of truth.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the (unpackaged) scripts/ modules
addopts = "-ra --strict-markers"
markers = [
    "contract: schema-driven contract/fuzz tests (Schemathesis)",
    "integration: needs Docker (testcontainers Postgres); deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["strata_engine_auth"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# strata-identity/strata-core are installed editable (PEP 660 import hooks mypy
# can't follow); resolve them from source instead.
mypy_path = "../strata.identity:../strata.core"

[[tool.mypy.overrides]]
# boto3/botocore/testcontainers ship no type stubs.
module = ["boto3.*", "botocore.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
