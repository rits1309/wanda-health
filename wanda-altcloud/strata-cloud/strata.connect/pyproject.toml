[project]
name = "strata.connect"
version = "0.1.0"
description = "Strata.Engine service — scaffolded to the Savanna backend baseline."
requires-python = ">=3.13"
dependencies = [
    "strata-core",  # canonical models + domain vocabulary (local path dep)
    "strata-identity",  # the identifiers seam — registration writes route through it (Identity)
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",  # random suite order every run: order-coupling fails loudly
    "httpx>=0.27",
    "testcontainers>=4.0",
    "invoke>=2.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (spins a real Jaeger); deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs DB code on greenlets; without this, every line after the
# first `await session.execute(...)` in a function is invisibly un-measured.
concurrency = ["thread", "greenlet"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# strata-core is installed editable (PEP 660 import hooks mypy can't follow); point mypy
# at the source tree instead — the booking service's pattern.
mypy_path = "../strata.core:../strata.identity"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
