[project]
name = "strata-member"
version = "0.1.0"
description = "The clinical write-seam library for Savanna — session-taking helpers that own the clinical domain's write invariants (member demographics; later diagnoses/procedures/medications). Models and migrations live in strata-core."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",  # the write helpers take AsyncSession
    "strata-core",               # the canonical clinical models + migration history (local path dep)
]

[project.optional-dependencies]
# Everything needed to test, lint, type-check, and security-scan the project.
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "anyio>=4.4",                     # async test backend
    "testcontainers[postgres]>=4.0",  # ephemeral Postgres for DB-touching tests
    "invoke>=2.0",                    # task runner (tasks.py)
    "ruff>=0.7",                      # lint + format
    "mypy>=1.11",                     # static type checking
    "bandit>=1.7",                    # SAST security linter
    "pip-audit>=2.7",                 # dependency CVE scanner
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_member*"]

[tool.setuptools.package-data]
# The package is fully typed (mypy strict); consumers' type-checkers rely on this.
strata_member = ["py.typed"]

# ---------------------------------------------------------------------------
# Tool config — kept here so pyproject.toml is the single source of truth.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers Postgres); deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["strata_member"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# strata-core is installed editable (PEP 660 import hooks mypy can't follow);
# resolve it from source instead.
mypy_path = "../strata.core"

[[tool.mypy.overrides]]
# testcontainers ships no type stubs / py.typed marker.
module = "testcontainers.*"
ignore_missing_imports = true

[tool.bandit]
# The test tree is allowed to use asserts and fixtures freely.
exclude_dirs = ["tests", ".venv"]
