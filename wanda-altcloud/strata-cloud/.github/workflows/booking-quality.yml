name: Booking · Quality

# strata.booking is one subproject in this multi-service repo; scope CI to it by path
# so unrelated changes (strata.engine, strata.engine.auth) don't trigger this run.
on:
  push:
    branches: [main]
    paths:
      - "strata.booking/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/booking-quality.yml"
  pull_request:
    paths:
      - "strata.booking/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/booking-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service lives in the strata.booking/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.booking
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            strata.booking/pyproject.toml
            strata.identity/pyproject.toml

      # strata-identity/strata-core are local path dependencies (see pyproject.toml);
      # the editable installs resolve them from the sibling folders.
      - name: Install dependencies
        run: pip install -e ../strata.identity -e ../strata.core -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_booking scripts

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_booking scripts

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
