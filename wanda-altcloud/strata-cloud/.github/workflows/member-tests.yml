name: Member · Tests

# strata.member is one subproject in this multi-service repo; scope CI to it by path.
# strata.core is included: the write seam consumes the canonical clinical models from there.
on:
  push:
    branches: [main]
    paths:
      - "strata.member/**"
      - "strata.core/**"
      - ".github/workflows/member-tests.yml"
  pull_request:
    paths:
      - "strata.member/**"
      - "strata.core/**"
      - ".github/workflows/member-tests.yml"

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strata.member
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.member/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../strata.core -e ".[dev]"

      - name: Pull Postgres image
        run: docker pull postgres:16

      - name: Run tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pytest --cov --cov-report=xml --cov-report=html \
                 --junitxml=test-results/junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: strata.member/test-results/junit.xml
          retention-days: 30

      - name: Upload coverage (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            strata.member/htmlcov/
            strata.member/coverage.xml
          retention-days: 30
