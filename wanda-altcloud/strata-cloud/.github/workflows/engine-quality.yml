name: Engine · Quality

# strata.engine is one subproject in this multi-service repo; scope CI to it by path.
on:
  push:
    branches: [main]
    paths:
      - "strata.engine/**"
      - ".github/workflows/engine-quality.yml"
  pull_request:
    paths:
      - "strata.engine/**"
      - ".github/workflows/engine-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service lives in the strata.engine/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.engine/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_engine

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_engine

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
