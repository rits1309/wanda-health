name: Terminology · Quality

# strata.terminology is one subproject in this multi-service repo; scope CI to it by path
# so unrelated changes don't trigger this run. If this service gains a local path
# dependency (e.g. strata.identity), add that dependency's path here so a library
# change re-gates its consumer (see engine-auth-quality.yml).
on:
  push:
    branches: [main]
    paths:
      - "strata.terminology/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/terminology-quality.yml"
  pull_request:
    paths:
      - "strata.terminology/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/terminology-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service lives in the strata.terminology/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.terminology
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.terminology/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" -e ../strata.core -e ../strata.identity

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_terminology scripts

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_terminology scripts

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
