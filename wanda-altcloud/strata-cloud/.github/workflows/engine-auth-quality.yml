name: Engine.Auth · Quality

# strata.engine.auth is one subproject in this multi-service repo; scope CI to it by
# path. strata.identity and strata.core are included: both are this service's local
# path dependencies (the seam library and the canonical models), so a
# library change must re-gate its first consumer.
on:
  push:
    branches: [main]
    paths:
      - "strata.engine.auth/**"
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/engine-auth-quality.yml"
  pull_request:
    paths:
      - "strata.engine.auth/**"
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/engine-auth-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service lives in the strata.engine.auth/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.engine.auth
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            strata.engine.auth/pyproject.toml
            strata.identity/pyproject.toml

      # strata-identity is a local path dependency (see pyproject.toml); the editable
      # sibling install satisfies it.
      - name: Install dependencies
        run: pip install -e ../strata.identity -e ../strata.core -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_engine_auth scripts tests

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_engine_auth

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
