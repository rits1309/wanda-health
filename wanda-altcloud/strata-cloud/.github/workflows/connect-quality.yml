name: Connect · Quality

# strata.connect is one subproject in this multi-service repo; scope CI to it by path
# so unrelated changes don't trigger this run. strata.core and strata.identity are local path dependencies,
# so a kernel change re-gates this consumer (see engine-auth-quality.yml).
on:
  push:
    branches: [main]
    paths:
      - "strata.connect/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/connect-quality.yml"
  pull_request:
    paths:
      - "strata.connect/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/connect-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service lives in the strata.connect/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.connect
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.connect/pyproject.toml

      # strata-core is a local path dependency (see pyproject.toml); install it editable
      # from the sibling folder — the booking service's pattern.
      - name: Install dependencies
        run: pip install -e ../strata.core -e ../strata.identity -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy app

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r app

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
