name: Member · Quality

# strata.member is one subproject in this multi-service repo; scope CI to it by path.
# strata.core is included: the write seam consumes the canonical clinical models from there.
on:
  push:
    branches: [main]
    paths:
      - "strata.member/**"
      - "strata.core/**"
      - ".github/workflows/member-quality.yml"
  pull_request:
    paths:
      - "strata.member/**"
      - "strata.core/**"
      - ".github/workflows/member-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strata.member
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.member/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../strata.core -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_member tests

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_member

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
