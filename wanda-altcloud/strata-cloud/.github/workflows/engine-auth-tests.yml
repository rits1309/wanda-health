name: Engine.Auth · Tests

# strata.engine.auth is one subproject in this multi-service repo; scope CI to it by
# path. strata.identity and strata.core are included: both are this service's local
# path dependencies (the seam library and the canonical models), so a
# library change must re-gate its first consumer.
on:
  push:
    branches: [main]
    paths:
      - "strata.engine.auth/**"
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/engine-auth-tests.yml"
  pull_request:
    paths:
      - "strata.engine.auth/**"
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/engine-auth-tests.yml"

jobs:
  pytest:
    name: pytest (unit + api + integration + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The service lives in the strata.engine.auth/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.engine.auth
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            strata.engine.auth/pyproject.toml
            strata.identity/pyproject.toml

      # strata-identity is a local path dependency (see pyproject.toml); the editable
      # sibling install satisfies it.
      - name: Install dependencies
        run: pip install -e ../strata.identity -e ../strata.core -e ".[dev]"

      # The `integration` tests spin up Postgres via testcontainers (Docker is
      # preinstalled on the runner). Pre-pull so the first test doesn't pay the
      # download inside its timeout.
      - name: Pull Postgres image
        run: docker pull postgres:16

      # Runs the whole suite once with coverage; emits JUnit XML + XML/HTML coverage.
      # conftest.py provides deterministic STRATA_* settings (incl. a placeholder
      # database URL that the testcontainers fixtures override). Ryuk (the reaper)
      # is disabled — GitHub tears the runner down anyway, and it avoids a
      # privileged sidecar.
      - name: Run tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pytest --cov --cov-report=xml --cov-report=html \
                 --junitxml=test-results/junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          # upload-artifact paths resolve from the repo root, not the job working-directory.
          path: strata.engine.auth/test-results/junit.xml
          retention-days: 30

      - name: Upload coverage (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            strata.engine.auth/htmlcov/
            strata.engine.auth/coverage.xml
          retention-days: 30
