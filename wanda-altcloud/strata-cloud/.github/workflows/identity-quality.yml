name: Identity · Quality

# strata.identity is one subproject in this multi-service repo; scope CI to it by path.
# strata.core is included: the identity logic consumes the canonical models from there.
on:
  push:
    branches: [main]
    paths:
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/identity-quality.yml"
  pull_request:
    paths:
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/identity-quality.yml"

jobs:
  quality:
    name: lint · types · security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The library lives in the strata.identity/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.identity
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.identity/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../strata.core -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy strata_identity tests

      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r strata_identity

      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable
