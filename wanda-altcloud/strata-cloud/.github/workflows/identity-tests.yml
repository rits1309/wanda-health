name: Identity · Tests

# strata.identity is one subproject in this multi-service repo; scope CI to it by path.
# strata.core is included: the identity logic consumes the canonical models from there.
on:
  push:
    branches: [main]
    paths:
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/identity-tests.yml"
  pull_request:
    paths:
      - "strata.identity/**"
      - "strata.core/**"
      - ".github/workflows/identity-tests.yml"

jobs:
  pytest:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The library lives in the strata.identity/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.identity
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.identity/pyproject.toml

      - name: Install dependencies
        run: pip install -e ../strata.core -e ".[dev]"

      # The `integration` tests spin up Postgres via testcontainers (Docker is
      # preinstalled on the runner). Pre-pull so the first test doesn't pay the
      # download inside its timeout.
      - name: Pull Postgres image
        run: docker pull postgres:16

      # Runs the whole suite once with coverage; emits JUnit XML + XML/HTML coverage.
      # Ryuk (the reaper) is disabled — GitHub tears the runner down anyway, and it
      # avoids a privileged sidecar.
      - name: Run tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pytest --cov --cov-report=xml --cov-report=html \
                 --junitxml=test-results/junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          # upload-artifact paths resolve from the repo root, not the job working-directory.
          path: strata.identity/test-results/junit.xml
          retention-days: 30

      - name: Upload coverage (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            strata.identity/htmlcov/
            strata.identity/coverage.xml
          retention-days: 30
