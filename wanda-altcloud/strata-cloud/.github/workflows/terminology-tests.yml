name: Terminology · Tests

# strata.terminology is one subproject in this multi-service repo; scope CI to it by path
# so unrelated changes don't trigger this run. If this service gains a local path
# dependency (e.g. strata.identity), add that dependency's path here so a library
# change re-gates its consumer (see engine-auth-tests.yml).
on:
  push:
    branches: [main]
    paths:
      - "strata.terminology/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/terminology-tests.yml"
  pull_request:
    paths:
      - "strata.terminology/**"
      - "strata.core/**"
      - "strata.identity/**"
      - ".github/workflows/terminology-tests.yml"

jobs:
  pytest:
    name: pytest (unit + api + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The service lives in the strata.terminology/ subfolder; run every step from there.
    defaults:
      run:
        working-directory: strata.terminology
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: strata.terminology/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" -e ../strata.core -e ../strata.identity

      # The scaffold is DB-less, so plain pytest — no database containers. The hermetic
      # `integration` test spins a real Jaeger via testcontainers (Docker is preinstalled
      # on the runner). Ryuk (the reaper) is disabled — GitHub tears the runner down
      # anyway, and it avoids a privileged sidecar. When this service gains a DB, also
      # pre-pull the Postgres image (docker pull postgres:16) and provide a placeholder
      # STRATA_DATABASE_URL for import-time settings (see engine-tests.yml).
      - name: Run tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pytest --cov --cov-report=xml --cov-report=html \
                 --junitxml=test-results/junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          # upload-artifact paths resolve from the repo root, not the job working-directory.
          path: strata.terminology/test-results/junit.xml
          retention-days: 30

      - name: Upload coverage (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            strata.terminology/htmlcov/
            strata.terminology/coverage.xml
          retention-days: 30
