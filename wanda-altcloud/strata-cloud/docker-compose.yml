# The ONE shared local Postgres for the strata-cloud workspace:
# every service and strata.core's tooling target this container on the DEFAULT port 5432.
# It replaces the retired per-service containers (engine 5432, booking 5433, identity 5434).
#
# Pinned to Postgres 16 to match the intended AWS RDS/Aurora major version, so pg_trgm
# indexes and SQL behave identically locally and in production. The same image backs the
# test suites (testcontainers) — one definition, two uses.
#
#   docker compose up -d --wait db            (or `inv db-up` from any service)
#   cd strata.core && inv migrate && inv seed --profile demo
#   (profiles: minimal · demo · booking-acceptance · readings-demo — each service's
#   README names the profile its runbook expects, e.g. strata.connect → readings-demo)
#
# First pull after the consolidation: remove any lingering pre-epic containers first
# (they collide on the port and the container names) —
#   docker rm -f strata-postgres strata-booking-postgres strata-identity-postgres strata-jaeger
services:
  db:
    image: postgres:16
    container_name: strata-postgres
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local trace backend — only under the "observability" profile, so it never
  # affects db-up. Start with `inv trace-up` from any service (engine/booking/terminology); UI at :16686 — the same
  # waterfalls X-Ray shows on AWS.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: strata-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP/HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  pgdata:
