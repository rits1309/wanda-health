[project]
name = "strata-engine"
version = "0.1.0"
description = "Strata.Engine shell — the reference-data domains were extracted to strata.terminology."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Observability: structured logging + OpenTelemetry tracing, exported to
    # X-Ray/CloudWatch on AWS and (optionally) a local Jaeger. The core OTel API/SDK is 1.x
    # stable; the instrumentation-* contrib packages are pre-1.0 (0.x) — pin/watch on upgrade.
    "structlog>=24.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",  # OTLP/HTTP → Jaeger 4318 / X-Ray endpoint
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
# Everything needed to test, lint, type-check, and security-scan the project.
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",            # Starlette TestClient + httpx.AsyncClient
    "anyio>=4.4",             # async test backend
    "testcontainers[postgres]>=4.0",  # ephemeral Postgres for the test suite (real SQL path)
    "invoke>=2.0",            # task runner (tasks.py) — the Python replacement for make
    "ruff>=0.7",              # lint + format
    "mypy>=1.11",            # static type checking
    "bandit>=1.7",           # SAST security linter
    "pip-audit>=2.7",        # dependency CVE scanner
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_engine*"]

# ---------------------------------------------------------------------------
# Tool config — kept here so pyproject.toml is the single source of truth.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# Co-located suites under tests/ (the domain suites moved to strata.terminology).
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (spins a real Jaeger); deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["strata_engine"]
branch = true

[tool.coverage.report]
show_missing = true
# No enforced threshold yet — ratchet / per-area philosophy (see TESTING.md).

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic autogenerates migration scripts with their own style (long lines, conditional
# imports); lint the env we author, not the generated revisions.
extend-exclude = ["alembic/versions", ".claude"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
# The test tree is allowed to use asserts and fixtures freely.
exclude_dirs = ["tests", ".venv"]
