[project]
name = "strata-terminology"
version = "0.1.0"
description = "strata.terminology — Savanna clinical terminology (reference-data) service: medications, procedures, diagnoses."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",  # async ORM + Core; the reference-data store
    "asyncpg>=0.30",             # async PostgreSQL driver
    "structlog>=24.1",
    "strata-core",  # canonical models + migration history (local path dep)
    "strata-identity",  # the shared verification seam (local path dep)
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.4",                     # async test backend
    "schemathesis>=4.0",              # OpenAPI schema-driven contract/fuzz testing
    "testcontainers[postgres]>=4.0",  # ephemeral Postgres for the test suite (real SQL path)
    "invoke>=2.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_terminology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The ingestion `scripts/` package is project-local (not installed); bare `pytest` (CI)
# needs the root on sys.path — `python -m pytest` (inv test) adds it implicitly.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "contract: schema-driven contract/fuzz tests (Schemathesis)",
    "integration: needs Docker (spins a real Jaeger); deselect with -m 'not integration'",
    # Hits live third-party data sources (FDA/CMS) over the network and is slow (~mins).
    # Opt-in only: excluded from the default run / CI; run with `inv test-realdata`.
    "external: real-data end-to-end; needs Docker + network; deselect with -m 'not external'",
]

[tool.coverage.run]
source = ["strata_terminology"]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# strata-core/strata-identity are installed editable (PEP 660 import hooks mypy
# can't follow), so point mypy at the sibling sources directly.
mypy_path = "../strata.identity:../strata.core"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
