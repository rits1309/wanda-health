[project]
name = "strata-core"
version = "0.1.0"
description = "The canonical database project for the Savanna operational store — all schema, the single Alembic history, and the fixture library, consumed as a package by the Strata services."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",    # STRATA_* typed settings (baseline convention)
    "sqlalchemy[asyncio]>=2.0",  # async ORM; the canonical models
    "asyncpg>=0.30",             # async PostgreSQL driver
    "alembic>=1.13",             # the single canonical migration history
]

[project.optional-dependencies]
# Everything needed to test, lint, type-check, and security-scan the project.
# Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",  # random suite order every run: order-coupling fails loudly
    "anyio>=4.4",                     # async test backend
    "testcontainers[postgres]>=4.0",  # ephemeral Postgres for DB-touching tests
    "invoke>=2.0",                    # task runner (tasks.py)
    "ruff>=0.7",                      # lint + format
    "mypy>=1.11",                     # static type checking
    "bandit>=1.7",                    # SAST security linter
    "pip-audit>=2.7",                 # dependency CVE scanner
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["strata_core*"]

[tool.setuptools.package-data]
# The package is fully typed (mypy strict); consumers' type-checkers rely on this.
strata_core = ["py.typed"]

# ---------------------------------------------------------------------------
# Tool config — kept here so pyproject.toml is the single source of truth.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers Postgres); deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["strata_core"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic autogenerates migration scripts with their own style; lint the env we
# author, not the generated revisions.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# testcontainers ships no type stubs / py.typed marker.
module = "testcontainers.*"
ignore_missing_imports = true

[tool.bandit]
# The test tree is allowed to use asserts and fixtures freely.
exclude_dirs = ["tests", ".venv"]
