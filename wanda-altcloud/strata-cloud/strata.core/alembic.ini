[alembic]
script_location = alembic
# Overridden at runtime by STRATA_DATABASE_URL (see alembic/env.py); this default
# matches the shared workspace Postgres (repo-root docker-compose.yml, port 5432).
sqlalchemy.url = postgresql+asyncpg://strata:strata@localhost:5432/strata

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
