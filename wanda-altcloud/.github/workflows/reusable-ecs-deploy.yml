name: Reusable - ECS Deploy

# Called only. Deploy-only -- never builds or scans.
#
# Rather than reconstruct env vars/secrets/roles from scratch against a
# static template (the original design), this fetches the latest ACTIVE
# task definition revision Terraform has registered for the service and
# patches only the image, keeping everything else -- env vars, Secrets
# Manager refs, execution/task roles, log config, CORS, OTEL settings --
# exactly as your infra already has it configured. Confirmed against a real
# describe-task-definition pull (wandahealth-dev-strata-booking, revision
# 6) that the actual deployed config has several fields a static template
# would've had to guess at correctly (a JSON-keyed Secrets Manager ARN
# suffix, a shared task role applied even to non-auth services, a plain
# PORT var alongside the STRATA_-prefixed ones, STRATA_ENVIRONMENT=dev not
# "develop") -- fetching the real thing sidesteps all of that entirely,
# and self-heals if the AWS/Terraform side changes any of it later.
#
# Deliberately resolves by task-definition FAMILY (see the "Fetch latest
# task definition" step below), not by asking the ECS service what it's
# currently running -- the service's own task-definition pointer is frozen
# at whatever revision it started on (`ignore_changes = [task_definition]`
# in modules/compute/ecs/main.tf), so it goes stale the moment Terraform
# registers a new revision (e.g. an env var fix) without this pipeline ever
# picking it up otherwise.
#
# Only ECS_CLUSTER, ECS_SERVICE_<KEY>, and HEALTH_URL_<KEY> are needed as
# vars.* here (KEY = BOOKING / CONNECT / AUTH / TERMINOLOGY / ENGINE --
# AUTH, not ENGINE_AUTH, matching reusable-build-scan-push.yml's own
# ECR_REGISTRY_<KEY> shorthand; the underlying repo it resolves to is
# wandahealth-<env>-strata-engine-auth, Terraform-managed). ECS_CLUSTER
# and every ECS_SERVICE_<KEY> are set (develop environment, confirmed
# against a real `aws ecs list-services`). HEALTH_URL_<KEY> is still
# unset as of this writing.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy into (develop, uat, prod)"
        required: true
        type: string
      service:
        description: "Service key: booking, connect, engine-auth, terminology, engine"
        required: true
        type: string
      image_tag:
        description: "ECR tag to deploy, e.g. develop-<sha> (mutually exclusive with image_digest)"
        required: false
        type: string
        default: ""
      image_digest:
        description: "ECR digest to deploy, e.g. sha256:... (mutually exclusive with image_tag; wins if both given)"
        required: false
        type: string
        default: ""
      skip_smoke_test:
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service metadata
        id: meta
        run: |
          case "${{ inputs.service }}" in
            booking)      VAR_KEY="BOOKING" ;;
            connect)      VAR_KEY="CONNECT" ;;
            engine-auth)  VAR_KEY="AUTH" ;;
            terminology)  VAR_KEY="TERMINOLOGY" ;;
            engine)       VAR_KEY="ENGINE" ;;
            *) echo "::error::Unknown service key '${{ inputs.service }}'"; exit 1 ;;
          esac
          echo "var_key=$VAR_KEY" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsDeploy

      - name: Resolve image reference
        id: image
        env:
          # ECR_REGISTRY_<KEY> already holds the full <registry>/<repo> path.
          ECR_IMAGE_PATH: ${{ vars[format('ECR_REGISTRY_{0}', steps.meta.outputs.var_key)] }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [ -n "$IMAGE_DIGEST" ]; then
            REF="${ECR_IMAGE_PATH}@${IMAGE_DIGEST}"
          elif [ -n "$IMAGE_TAG" ]; then
            REF="${ECR_IMAGE_PATH}:${IMAGE_TAG}"
          else
            echo "::error::Neither image_tag nor image_digest was provided."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # Resolves by task-definition FAMILY, not via `describe-services`'
      # services[0].taskDefinition -- the ECS service's `modules/compute/ecs`
      # Terraform resource has `lifecycle { ignore_changes = [task_definition] }`,
      # so once created, the service's own task-definition pointer is frozen
      # forever at whatever revision it started on, even as Terraform keeps
      # registering new revisions underneath it (e.g. an env var fix). Confirmed
      # by a real deploy: fetching via describe-services kept re-patching the
      # image onto that same stale, frozen revision, silently reverting every
      # Terraform-side fix on every deploy. `--task-definition <family>` with
      # no revision suffix always resolves to the latest ACTIVE revision.
      # Family and ECS_SERVICE_<KEY> are guaranteed equal here -- both come
      # from the identical "${var.name_prefix}-${each.key}" expression in
      # modules/compute/ecs/main.tf (aws_ecs_task_definition.family and
      # aws_ecs_service.name) -- not a coincidence to be wary of drifting.
      - name: Fetch latest task definition
        id: current
        env:
          FAMILY: ${{ vars[format('ECS_SERVICE_{0}', steps.meta.outputs.var_key)] }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' > raw-task-definition.json

          # Strip the read-only fields describe-task-definition returns but
          # register-task-definition (which the deploy action calls under
          # the hood) rejects if they're present.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            raw-task-definition.json > current-task-definition.json

          CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' current-task-definition.json)
          echo "container_name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

      - name: Patch image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: current-task-definition.json
          container-name: ${{ steps.current.outputs.container_name }}
          image: ${{ steps.image.outputs.ref }}

      # 5 minutes, not the waiter's own ~10-15min default -- a service stuck
      # cycling tasks (bad health check, crash loop, capacity starvation) is
      # already diagnosable well before that, and failing fast here is what
      # makes the "Dump ECS service events on failure" step below actually
      # useful for debugging instead of arriving after a half-hour wait.
      - name: Deploy to ECS (rolling update, wait for stability)
        timeout-minutes: 10
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars[format('ECS_SERVICE_{0}', steps.meta.outputs.var_key)] }}
          wait-for-service-stability: true

      - name: Dump ECS service events on failure
        if: failure()
        env:
          FAMILY: ${{ vars[format('ECS_SERVICE_{0}', steps.meta.outputs.var_key)] }}
        run: |
          aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "$FAMILY" \
            --query 'services[0].{deployments:deployments,events:events[0:15]}' \
            --output json

      - name: Smoke test deployed health endpoint
        if: ${{ !inputs.skip_smoke_test }}
        env:
          HEALTH_URL: ${{ vars[format('HEALTH_URL_{0}', steps.meta.outputs.var_key)] }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::HEALTH_URL_${{ steps.meta.outputs.var_key }} is not set -- skipping smoke test. The deploy itself already succeeded and waited for ECS service stability."
            exit 0
          fi
          ./scripts/smoke-test.sh "${HEALTH_URL}/health"
