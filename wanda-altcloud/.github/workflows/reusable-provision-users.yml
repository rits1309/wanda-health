name: Reusable - Provision Users

# Called only, from ci.yml (develop) and deploy-uat.yml (uat) after their own
# deploy job succeeds. Runs strata.engine.auth/scripts/provision_users.py
# as a one-off ECS task, not via ecs execute-command -- run-task is
# non-interactive and CI-native (no SSM session to manage), and it reuses
# the SAME task definition family + network configuration the real
# engine-auth service already runs under, so it authenticates as the
# identical task role and reaches the identical database.
#
# Deliberately has no `environment: prod` caller and no input validation
# against it -- prod is excluded at the call site (neither ci.yml nor
# deploy-uat.yml has a path into prod), and the script's own _guard() refuses
# outright if it were ever pointed there anyway. Two independent stops,
# on purpose.

on:
  workflow_call:
    inputs:
      environment:
        description: "develop or uat -- never prod (see this file's header comment)"
        required: true
        type: string

jobs:
  provision:
    name: Provision users (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsProvisionUsers

      # Deliberately the OPPOSITE resolution strategy from
      # reusable-ecs-deploy.yml's "Fetch latest task definition" step. That
      # workflow resolves by FAMILY because it's about to REGISTER a new
      # revision -- it wants Terraform's latest configured attributes as
      # its patch base. This workflow wants to RUN AGAINST whatever image
      # is actually live right now, so it asks the SERVICE what it's
      # currently running instead. Resolving by family here picks up
      # whatever the highest-numbered revision happens to be -- which can
      # be a revision Terraform itself (re-)registered using
      # var.bootstrap_image_tag as a placeholder (modules/compute/ecs's
      # aws_ecs_task_definition always builds its image ref that way; the
      # service's OWN pointer is frozen post-deploy via
      # ignore_changes = [task_definition], so a later `terraform apply`
      # can silently become the new "latest" without ever being what the
      # service runs). Confirmed by a real failure:
      # CannotPullContainerError on a ":bootstrap" tag that was never
      # actually pushed to ECR.
      - name: Resolve task definition + network config
        id: resolve
        env:
          FAMILY: ${{ vars.ECS_SERVICE_AUTH }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: |
          set -euo pipefail
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$FAMILY" \
            --query 'services[0].taskDefinition' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)
          echo "container_name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

          aws ecs describe-services --cluster "$CLUSTER" --services "$FAMILY" \
            --query 'services[0].networkConfiguration' --output json > network-config.json

      - name: Run provision_users.py as a one-off task
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          TASK_DEF_ARN: ${{ steps.resolve.outputs.task_def_arn }}
          CONTAINER: ${{ steps.resolve.outputs.container_name }}
        run: |
          set -euo pipefail
          OVERRIDES=$(jq -n --arg name "$CONTAINER" \
            '{containerOverrides: [{name: $name, command: ["python3", "-m", "scripts.provision_users"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "file://network-config.json" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started provisioning task: $TASK_ARN (task def: $TASK_DEF_ARN)"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "provision_users.py exit code: $EXIT_CODE"

          LOG_STREAM_PREFIX=$(aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"' --output text)
          LOG_GROUP=$(aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' --output text)
          TASK_ID="${TASK_ARN##*/}"
          LOG_STREAM="$LOG_STREAM_PREFIX/$CONTAINER/$TASK_ID"

          if [ "$EXIT_CODE" != "0" ]; then
            # Fetch the actual container output here, in the same OIDC-authenticated
            # step, rather than just printing a log-tail command for a human (or an
            # AI session with its own pasted credentials) to run separately -- a
            # failure here should be self-diagnosing from the job log alone, no
            # extra AWS access needed by anyone. `|| true` so a logs API hiccup
            # can't mask the real failure below it with a different one.
            {
              echo "### provision_users.py failed (exit $EXIT_CODE)"
              echo '```'
              aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" \
                --query 'events[].message' --output text || echo "(could not fetch logs -- log group/stream: $LOG_GROUP / $LOG_STREAM)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::provision_users.py failed (exit $EXIT_CODE) -- see the log output above."
            exit 1
          fi
