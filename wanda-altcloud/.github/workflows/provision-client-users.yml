name: Provision Client Users

# Manual only, on purpose: creating a real person's login stays a
# deliberate action a human chooses to take, not something that fires
# automatically off a git push -- see the discussion that led to this file.
# What IS automated here is everything tedious about doing that by hand
# (resolving the live task definition, building the run-task override
# JSON, waiting for it) AND a genuine health check: every brand-new
# account gets a real login attempt against the live environment before
# this workflow reports success, not just a trust in the script's own
# exit code. The actual logic lives in
# .github/scripts/provision-client-users.sh, not inlined here, so it can
# be run and tested from a laptop too.
#
# The user list lives in the CLIENT_USERS_CSV secret for the target
# environment, never in a committed file -- real emails are PII, and a
# GitHub secret never appears in git history the way a committed CSV would.
# To add someone: update that secret's value (Settings -> Environments ->
# <environment> -> Secrets) with the full, current list, then run this
# workflow. provision_users_from_csv.py's own check-first logic means only
# the genuinely new email(s) get created -- everyone already provisioned is
# left untouched, so re-running the same list is always safe.
#
# No prod option, by design, same as reusable-provision-users.yml -- and
# the script's own _guard() refuses outright if it were ever pointed there
# anyway. Two independent stops.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "develop or uat -- never prod (see this file's header comment)"
        required: true
        type: choice
        options: [develop, uat]

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: Provision client users (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # The logic lives in .github/scripts/provision-client-users.sh, so the
      # repository has to be on the runner. Without this the step fails with
      # exit 127 (no such file) before it ever reaches AWS -- confirmed by a
      # real uat run.
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsProvisionClientUsers

      - name: Provision + health-check
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          FAMILY: ${{ vars.ECS_SERVICE_AUTH }}
          LOGIN_BASE_URL: ${{ vars.LOGIN_BASE_URL }}
          # The list itself -- an environment secret, never a committed file.
          USERS_CSV_CONTENT: ${{ secrets.CLIENT_USERS_CSV }}
        run: |
          if [ -z "${USERS_CSV_CONTENT:-}" ]; then
            echo "::error::CLIENT_USERS_CSV is empty or not set for the '${{ inputs.environment }}' environment -- add it under Settings -> Environments -> ${{ inputs.environment }} -> Secrets before running this."
            exit 1
          fi
          bash .github/scripts/provision-client-users.sh
