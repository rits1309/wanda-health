      # new requirements not yet covered by an approved CR. Left
      # commented, not removed, so re-enabling once the CR is approved
      # is a straight uncomment, not a rebuild. The smoke check below
      # (starts the real service, polls /health) is unaffected and stays
      # active -- it isn't part of this toolchain discussion.
