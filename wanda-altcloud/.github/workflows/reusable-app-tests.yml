name: Reusable - App Tests

# Called only (workflow_call) -- never triggers on its own. Runs once per
# service via a matrix built from the caller's `services` input, so a new
# service opts in by adding a matrix row upstream (in ci.yml's
# detect-services job), not by touching this file.
#
# Quality (ruff/mypy/bandit/pip-audit) and tests (pytest via testcontainers)
# steps below are currently COMMENTED OUT, not deleted -- pending an
# approved client Change Request (see the block comment further down for
# the full reasoning). Only the smoke check against /health is active
# right now. Once the CR is approved, uncommenting those steps restores
# the full stage described below.
#
# Those steps, when active, are copied verbatim in intent from the
# client's own strata-cloud/.github/workflows/<service>-quality.yml and
# <service>-tests.yml -- those files are never actually executed by
# GitHub (nested .github/, not the repo root -- see ci.yml's header) but
# they're the real, working spec for what each service's CI is supposed
# to run, so this reuses their exact commands/module targets rather than
# guessing. Only the final smoke check against /health is new -- the
# client's own files stop at pytest.
#
# pytest uses testcontainers for an ephemeral Postgres and needs no external
# database (Ryuk disabled, same as the client's files -- GitHub tears the
# runner down anyway). The shared strata.core Postgres via `docker compose`
# is only started later, just for the smoke check, which needs a real
# running service.

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array of service keys to test, e.g. ["booking","connect"]'
        required: true
        type: string
      run_tests:
        description: "Run quality + unit tests + smoke check at all"
        required: false
        type: boolean
        default: true

jobs:
  test:
    name: ${{ matrix.service }}
    if: inputs.run_tests && inputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for service key -> folder/port/lint targets,
      # shared shape with reusable-build-scan-push.yml and
      # reusable-ecs-deploy.yml. mypy/bandit targets and the connect
      # service's "app" package name (not strata_connect) are taken directly
      # from the client's own per-service quality.yml files. Add a new
      # service here (and in ci.yml's detect-services filters) rather than
      # inventing a second mapping.
      - name: Resolve service metadata
        id: meta
        run: |
          case "${{ matrix.service }}" in
            booking)      DIR="strata.booking";     PORT=8010; MYPY_TARGET="strata_booking scripts";            BANDIT_TARGET="strata_booking scripts"; INSTALL_ARGS='-e ../strata.core -e ../strata.identity -e ".[dev]"' ;;
            connect)      DIR="strata.connect";      PORT=8004; MYPY_TARGET="app";                               BANDIT_TARGET="app";                    INSTALL_ARGS='-e ../strata.core -e ../strata.identity -e ".[dev]"' ;;
            engine-auth)  DIR="strata.engine.auth";   PORT=8000; MYPY_TARGET="strata_engine_auth scripts tests"; BANDIT_TARGET="strata_engine_auth";     INSTALL_ARGS='-e ../strata.core -e ../strata.identity -e ".[dev]"' ;;
            terminology)  DIR="strata.terminology";    PORT=8020; MYPY_TARGET="strata_terminology scripts";      BANDIT_TARGET="strata_terminology scripts"; INSTALL_ARGS='-e ../strata.core -e ../strata.identity -e ".[dev]"' ;;
            # engine has neither strata.core nor strata.identity as a dependency
            # (see strata.engine/pyproject.toml) -- plain install, no path deps.
            engine)       DIR="strata.engine";        PORT=8000; MYPY_TARGET="strata_engine";                    BANDIT_TARGET="strata_engine";          INSTALL_ARGS='-e ".[dev]"' ;;
            *) echo "::error::Unknown service key '${{ matrix.service }}'"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "mypy_target=$MYPY_TARGET" >> "$GITHUB_OUTPUT"
          echo "bandit_target=$BANDIT_TARGET" >> "$GITHUB_OUTPUT"
          echo "install_args=$INSTALL_ARGS" >> "$GITHUB_OUTPUT"

      # 3.13 to match the Dockerfiles (python:3.13-slim) and every quality/
      # tests file under strata-cloud/.github/ except booking-*.yml, which
      # pins 3.14 on its own -- looks like drift in that one client file
      # rather than the intended version; flagged, not silently copied here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            strata-cloud/${{ steps.meta.outputs.dir }}/pyproject.toml
            strata-cloud/strata.core/pyproject.toml
            strata-cloud/strata.identity/pyproject.toml

      # ---------------------------------------------------------------
      # DISABLED, NOT DELETED -- pending client Change Request approval.
      # Ruff/mypy/bandit/pip-audit, and the pytest suite (which itself
      # exercises Starlette TestClient, anyio, Schemathesis contract
