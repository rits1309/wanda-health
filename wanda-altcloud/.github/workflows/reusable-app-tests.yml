      #     TESTCONTAINERS_RYUK_DISABLED: "true"
      #   run: |
      #     pytest --cov --cov-report=xml --cov-report=html \
      #            --junitxml=test-results/junit.xml
      #
      # - name: Upload JUnit results
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ matrix.service }}-pytest-junit
      #     path: strata-cloud/${{ steps.meta.outputs.dir }}/test-results/junit.xml
      #     if-no-files-found: warn
      #     retention-days: 30
      #
      # - name: Upload coverage (HTML + XML)
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ matrix.service }}-coverage
      #     path: |
      #       strata-cloud/${{ steps.meta.outputs.dir }}/htmlcov/
      #       strata-cloud/${{ steps.meta.outputs.dir }}/coverage.xml
      #     if-no-files-found: warn
      #     retention-days: 30

      # From here on: only needed for the smoke check, which starts a real
      # instance of the service against a real (if minimal) database --
      # unlike the pytest suite above, this isn't self-contained.
      #
      # `inv` tasks in every strata.* tasks.py shell out to `.venv/bin/<tool>`
      # by relative path (confirmed by a real run: `inv migrate` failed with
      # "bash: line 1: .venv/bin/alembic: No such file or directory" against
      # the plain global install above) -- they assume the local dev setup
      # documented in strata-cloud/CLAUDE.md (`python3 -m venv .venv &&
      # .venv/bin/pip install ...`), not a bare `pip install`. The quality/
      # test steps above call ruff/mypy/pytest/etc. directly, same as the
      # client's own CI files, so they never hit this; `inv migrate`/
      # `inv dev` do, so a real .venv is created here to match.
      - name: Start shared Postgres
        working-directory: strata-cloud
        run: docker compose up -d --wait db

      - name: Install & migrate strata.core
        working-directory: strata-cloud/strata.core
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          cp .env.example .env
          .venv/bin/inv migrate
          .venv/bin/inv seed --profile minimal

      - name: Set up service venv (for inv dev)
        working-directory: strata-cloud/${{ steps.meta.outputs.dir }}
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ${{ steps.meta.outputs.install_args }}
          cp .env.example .env

      # STRATA_DEV_AUTH_SECRET set explicitly here, not left to .env.example
      # -- booking/terminology ship a real default in their .env.example
      # so it happened to work for them via `cp .env.example .env`, but
      # engine-auth's own .env.example has it commented out (its default
      # posture is cognito mode, not dev), so with only STRATA_AUTH_MODE
      # forced to dev here, the identity seam fails closed at startup:
      # "STRATA_DEV_AUTH_SECRET is not set -- dev-mode verification needs
      # it" (confirmed by a real run). Same value booking/terminology's
      # own example files already use, so one dev token remains valid
      # across all of them.
      - name: Smoke check against /health (dev-mode auth)
        env:
          STRATA_AUTH_MODE: dev
          STRATA_ENVIRONMENT: local
          STRATA_DEV_AUTH_SECRET: local-dev-secret-change-me-0123456789abcdef
          PORT: ${{ steps.meta.outputs.port }}
        working-directory: strata-cloud/${{ steps.meta.outputs.dir }}
        run: |
          .venv/bin/inv dev &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=""
          for i in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${PORT}/health" > /dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ -z "$READY" ]; then
            echo "::error::${{ matrix.service }} never became healthy on /health within 60s"
            exit 1
          fi

          echo "${{ matrix.service }} smoke check passed on port ${PORT}"
