name: Cut Release Branch

# Manual only, and takes NO inputs -- dispatch it exactly like
# cut-uat-branch.yml: pick the workflow, press Run. Which uat branch is
# being released is worked out here rather than typed in, because the
# pipeline already knows and a hand-typed branch name is both tedious and
# easy to get wrong for something this consequential.
#
# Why not simply take the newest uat/** branch by date: because a uat
# branch holds OLDER code from the moment it is cut until its promotion PR
# merges, so the newest one by date is routinely a branch that was never
# deployed, and releasing from it would quietly ship the previous release.
# Selection is therefore on the uat-<date>-<shortsha> tag deploy-uat.yml writes
# only after a successful deploy -- a fact about what actually ran, not
# about when a branch was created.
#
# Releasing an OLDER uat branch is deliberately not offered. Nothing here
# can express "ship the release before last", and that is the intended
# behaviour: a bad release is fixed forward on develop and promoted again,
# not re-cut from stale history.
#
# Creates releases/<date>-<shortsha> and opens a real
# <uat branch> -> releases/** PR. There is no throwaway promote-release/**
# branch. The new branch starts from the merge-base of the PREVIOUS
# releases/** branch and the uat branch, for the same reason as
# cut-uat-branch.yml: it is an ancestor of the uat branch, so merging the PR
# produces exactly the uat branch's tree, nothing committed straight onto an
# old release branch can ride along, and the PR can never conflict.
#
# Two things are still refused, both about workflow files develop has never
# had. Creating a branch is itself a push, and so is merging the PR, and each
# runs whatever workflows are in that commit -- so a stray file in the commit
# the new branch starts at, or in the uat branch being released, would run
# the moment this workflow (or the merge) pushes. That is exactly how an
# obsolete ci-release.yml, which triggers on push to releases/**, rebuilt
# prod images and ran prod migrations from a branch nobody meant to deploy.
#
# The PR's real purpose isn't reviewing a diff -- it's the audit trail
# (who cut this release, from which uat branch, when) and the scan gate:
# opening it runs ci.yml's pull_request trigger, which covers releases/**
# and runs the full App Tests + SecOps Scan against the release candidate
# without building or deploying anything.
#
# Merging this PR deploys NOTHING. Production only ever deploys from an
# explicit workflow_dispatch of deploy-release.yml, run by the person
# responsible for the release. That workflow deploys the latest release --
# the one this workflow cut -- once its PR is merged with every check passed.
#
# Named "releases/**", not "release/**" -- this repo has a separate,
# client-owned branch literally named "release" that predates this
# pipeline, and git can't have both refs/heads/release and
# refs/heads/release/<x> at once.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-branch:
    name: Cut releases/** branch + open PR
    runs-on: ubuntu-latest
    steps:
      # develop, not the uat branch: which uat branch this releases may not
      # be known until the resolve step below runs. fetch-tags matters --
      # the deploy tags are how "actually deployed" is established.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Cut branch and open the promotion PR
        # See cut-uat-branch.yml's identical comment: this enterprise
        # forbids the default Actions token from creating pull requests,
        # and the repo-level override is refused with a 409.
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UAT_BRANCH=""
          for candidate in $(git for-each-ref --sort=-committerdate \
            --format='%(refname:short)' 'refs/remotes/origin/uat/*'); do
            if git tag --points-at "$candidate" | grep -q '^uat-'; then
              UAT_BRANCH="${candidate#origin/}"
              break
            fi
          done

          if [ -z "$UAT_BRANCH" ]; then
            echo "::error::No uat/** branch has a successful-deploy tag from deploy-uat.yml, so there is nothing safe to release. Promote develop to UAT and let its deploy finish first."
            exit 1
          fi

          echo "Releasing $UAT_BRANCH (most recent uat branch with a successful deploy)"

          SHA="$(git rev-parse "origin/$UAT_BRANCH")"
          SUFFIX="$(date -u +%Y-%m-%d)-$(git rev-parse --short "$SHA")"
          RELEASE_BRANCH="releases/$SUFFIX"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PREV_RELEASE="$(git for-each-ref --sort=-committerdate \
            --format='%(refname:short)' 'refs/remotes/origin/releases/*' | head -n1)"

          if [ -n "$PREV_RELEASE" ]; then
            BASE_SHA="$(git merge-base "$PREV_RELEASE" "$SHA")"
          else
            BASE_SHA="$SHA"
          fi

          # Workflow files that have never existed on develop, in a commit
          # this run is about to push (the branch start) or that the PR merge
          # will push (the uat branch being released). See the header.
          stray_in() {
            for f in $(git ls-tree -r --name-only "$1" .github/workflows); do
              if [ -z "$(git log -1 --format=%h origin/develop -- "$f")" ]; then
                printf ' %s' "$f"
              fi
            done
          }
          STRAY_HEAD="$(stray_in "$SHA")"
          if [ -n "$STRAY_HEAD" ]; then
            echo "::error::Refusing to release $UAT_BRANCH: it carries workflow file(s) develop has never had:$STRAY_HEAD -- they would run the moment the release PR merges. It was promoted from a contaminated branch; promote develop to UAT again (Cut UAT Branch now starts from clean history) and re-run this once that deploy finishes."
            exit 1
          fi
          STRAY_BASE="$(stray_in "$BASE_SHA")"
          if [ -n "$STRAY_BASE" ]; then
            echo "::error::Refusing to cut $RELEASE_BRANCH: the commit it would start at ($(git rev-parse --short "$BASE_SHA")) carries workflow file(s) develop has never had:$STRAY_BASE -- pushing the branch would run them."
            exit 1
          fi

          if [ -z "$PREV_RELEASE" ]; then
            git branch "$RELEASE_BRANCH" "$SHA"
            git push origin "$RELEASE_BRANCH"
            echo "::notice::No previous releases/** branch exists, so $RELEASE_BRANCH was cut at $UAT_BRANCH's tip and no PR was opened -- there would be nothing to review. Every later release opens a real PR."
            exit 0
          fi

          AHEAD="$(git rev-list --count "$BASE_SHA..$SHA")"
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::$UAT_BRANCH has no commits beyond $PREV_RELEASE, so this release would contain nothing. Promote something to UAT first."
            exit 1
          fi

          if [ "$(git rev-list --count "$SHA..$PREV_RELEASE")" -gt 0 ]; then
            echo "::notice::$PREV_RELEASE carries commits $UAT_BRANCH never had. They are left behind: $RELEASE_BRANCH starts from $(git rev-parse --short "$BASE_SHA"), where the two last agreed, so this release is exactly $UAT_BRANCH."
          fi

          echo "Cutting $RELEASE_BRANCH at $(git rev-parse --short "$BASE_SHA") ($AHEAD commit(s) in this release since $PREV_RELEASE)"
          git branch "$RELEASE_BRANCH" "$BASE_SHA"
          git push origin "$RELEASE_BRANCH"

          # The branch exists regardless of what happens next, so a
          # PR-creation failure is recoverable by hand rather than leaving
          # a half-cut release behind.
          if gh pr create \
            --base "$RELEASE_BRANCH" \
            --head "$UAT_BRANCH" \
            --title "Cut release from $UAT_BRANCH ($SHA)" \
            --body "Opened by cut-releases-branch.yml: a real \`$UAT_BRANCH\` -> \`$RELEASE_BRANCH\` pull request, showing the $AHEAD commit(s) this release adds since \`$PREV_RELEASE\`. Opening it runs the full App Tests + SecOps Scan gate (ci.yml's pull_request trigger). Merging it does NOT deploy. Once it is merged and every check passed, production is deployed by dispatching Deploy - Release (Prod) from develop, which always deploys the latest release -- this one."
          then
            echo "Opened PR: $UAT_BRANCH -> $RELEASE_BRANCH"
          else
            echo "::error::Cut $RELEASE_BRANCH successfully, but could not open the release PR. If this is a token problem, add or fix the PROMOTION_PAT repository secret -- the default Actions token cannot create pull requests in this enterprise, and a fine-grained token must name the Wanda-Health org as its resource owner (a classic token with 'repo' scope works too). Nothing is lost meanwhile -- open the PR by hand at: ${{ github.server_url }}/${{ github.repository }}/compare/$RELEASE_BRANCH...$UAT_BRANCH"
            exit 1
          fi
