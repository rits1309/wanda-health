version: 2
updates:
  # --- pip: one entry per strata.* Python project (each has its own pyproject.toml / venv) ---
  - package-ecosystem: pip
    directory: /strata-cloud/strata.core
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.engine
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.engine.auth
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.booking
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.connect
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.terminology
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.identity
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: pip
    directory: /strata-cloud/strata.member
    schedule:
      interval: weekly
    target-branch: develop

  # --- docker: one entry per service that actually has a Dockerfile ---
  - package-ecosystem: docker
    directory: /strata-cloud/strata.booking
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: docker
    directory: /strata-cloud/strata.connect
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: docker
    directory: /strata-cloud/strata.engine.auth
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: docker
    directory: /strata-cloud/strata.terminology
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: docker
    directory: /strata-cloud/strata.engine
    schedule:
      interval: weekly
    target-branch: develop

  # --- github-actions: workflows now live at the true repo root ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
