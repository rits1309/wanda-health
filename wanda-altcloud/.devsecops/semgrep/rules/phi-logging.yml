rules:
  - id: sensitive-data-in-log-statement
    languages: [python]
    severity: WARNING
    message: >
      A logging/print call appears to reference a field name associated with
      PHI/PII (SSN, medical record, patient ID, diagnosis). Confirm this
      value is redacted or masked before it reaches a log statement.
    metadata:
      category: security
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
    patterns:
      - pattern-either:
          - pattern: logging.$METHOD(...)
          - pattern: logger.$METHOD(...)
          - pattern: print(...)
      - pattern-regex: '(?i)(ssn|social_security|medical_record|patient_id|diagnosis)'
