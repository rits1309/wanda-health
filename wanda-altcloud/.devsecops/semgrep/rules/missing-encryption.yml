rules:
  - id: hardcoded-credential-like-assignment
    languages: [python]
    severity: WARNING
    message: >
      Possible hardcoded credential, or a value that should be encrypted at
      rest/in transit. Review whether this should come from a secrets
      manager or environment variable instead of being embedded in source.
    metadata:
      category: security
      owasp: "A02:2021 - Cryptographic Failures"
    pattern-regex: '(?i)(password|secret|token|api_key|private_key)\s*=\s*["''][^"'']+["'']'
