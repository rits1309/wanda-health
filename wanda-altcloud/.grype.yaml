# Grype's own default config path -- auto-discovered from the working
# directory with no explicit --config flag needed. Moved here from
# .devsecops/grype-ignore.yaml after a real run proved anchore/scan-action@v6's
# documented `config:` input isn't actually wired into the grype CLI
# invocation it runs (confirmed from the job log: no --config flag, no
# GRYPE_CONFIG env var, despite the input being logged). Auto-discovery is
# Grype's own well-documented default behavior, not dependent on that
# wrapper action passing anything through correctly.
#
# Scoped, justified suppressions only, never a blanket "ignore everything"
# escape hatch. Each entry below is a documented false positive, not a
# real unresolved vulnerability being swept under the rug; anything
# genuinely fixable still counts toward the aggregate severity gate (see
# .github/workflows/RUNBOOK.md).
#
# CVE-2026-17084 / CVE-2026-15806 / CVE-2025-15367 -- all three matched by
# Grype's nvd:cpe matcher against the base image's own CPython binary
# (/usr/local/lib/libpython3.13.so.1.0, Python 3.13.15). Confirmed via a
# real scan's SARIF output: each one's "Fix Version" is 3.15.0rc2 or
# 3.15.0a6 -- a PRE-RELEASE of an entirely different, not-yet-stable major
# line, not a real patch release on the 3.13.x branch this image actually
# runs. No real deployment "fixes" a CVE by downgrading production to an
# alpha/RC of a future Python major version; this is a known NVD CPE gap
# for Python, where the CPE dictionary doesn't correctly represent
# independently-maintained parallel branches. If NVD/Grype's data is ever
# corrected to point at a real 3.13.x fix release, remove the matching
# entry below so the gate starts enforcing it again.
ignore:
  - vulnerability: CVE-2026-17084
    package:
      name: python
      type: binary
  - vulnerability: CVE-2026-15806
    package:
      name: python
      type: binary
  - vulnerability: CVE-2025-15367
    package:
      name: python
      type: binary
